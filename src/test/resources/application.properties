spring.application.name=reservehub-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

springdoc.swagger-ui.path=/swagger-ui.html
server.port=8080

app.jwt.secret=reservehub-test-secret-key-for-dev-testing-only-not-for-production-use
app.jwt.expiration-ms=86400000

# Deshabilitar rate limiting en tests para evitar falsos 429 por volumen de peticiones
rate-limit.enabled=false
