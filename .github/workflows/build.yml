name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ──────────────────────────────────────────────────────────────
  #  JOB 1: Tests + Quality Gates
  #  Corre PRIMERO. El deploy solo ocurre si este job pasa.
  # ──────────────────────────────────────────────────────────────
  quality:
    name: Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Ejecuta tests + Jacoco (cobertura) + SpotBugs (análisis estático)
      # "verify" = compile → test → jacoco:check → spotbugs:check
      - name: Run tests and quality checks
        run: mvn -B verify --file pom.xml

      - name: SonarCloud Analysis
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Jacoco coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ──────────────────────────────────────────────────────────────
  #  JOB 2: Build & Deploy
  #  Solo se ejecuta si quality pasó y es un push a main
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build & Deploy
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build JAR (skip tests — ya pasaron en quality)
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: target/reservehub.jar

      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: juanmauwu/reservehub
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Render detecta la nueva imagen en Docker Hub y reemplaza el contenedor.
      # Crear el secret: render.com → tu servicio → Settings → Deploy Hook → copiar URL
      # GitHub repo → Settings → Secrets → Actions → New secret: RENDER_DEPLOY_HOOK
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deploy triggered on Render"
